name: Github Runner Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the Docker image'
        required: true
        default: 'vx.y.z'
      latest:
        description: 'Push the image with the latest tag'
        type: 'boolean'
        required: false
        default: false
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GITHUB: ${{ github.repository }}/gh-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          file: github/Dockerfile.github
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GITHUB }}:${{ github.event.inputs.tag || 'v1.0.0' }}

      - name: Build and push Docker image and set to latest
        id: build-and-push-latest
        uses: docker/build-push-action@v6
        with:
          file: github/Dockerfile.github
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GITHUB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GITHUB }}:${{ github.event.inputs.tag || 'v1.0.0' }}
        if: github.event.inputs.latest == 'true'
